name: Deploy web

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  FTP_SERVER: ${{ secrets.FTP_SERVER }}
  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
  FTP_PORT: ${{ secrets.FTP_PORT }}
  FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
  FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Skip when FTP secrets are missing
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ]; then
            echo "::warning::FTP_SERVER or FTP_USERNAME secret is not set - skipping deployment"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Deploy via FTP
        if: env.SKIP != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR || '/factsflow/' }}
          log-level: minimal
