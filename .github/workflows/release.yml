name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "present=$([ -f android/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  apk:
    needs: guard
    runs-on: ubuntu-latest
    if: needs.guard.outputs.present == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not set - skipping release build"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.keystore
          {
            echo "storeFile=keystore.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
      - name: Build signed release APK and AAB
        if: env.SKIP != 'true'
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: env.SKIP != 'true'
        with:
          name: app-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Attach APK and AAB to the release
        if: github.event_name == 'release' && env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --repo "$GITHUB_REPOSITORY" --clobber
